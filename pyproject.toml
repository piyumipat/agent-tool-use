[project]
name = "agent-tool-use"
version = "0.1.0"
description = "Experiments with direct and MCP tools for AI agents"
requires-python = ">=3.11"
dependencies = [
    "httpx2>=2,<3",
    "jsonschema>=4,<5",
    "mcp>=2.1.1,<3",
    "openai>=2,<4",
    "python-dotenv>=1,<2",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
